<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="UTF-8">
    <title>egvozdek Final Project</title>
    <!-- Created by Elena Gvozdek, Nov 14th, 2026 -->
   
    <!--FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Oooh+Baby&display=swap" rel="stylesheet">

    
    <style>
      
/* Font for "Recipes" in the nav bar */
      @font-face {
        font-family: GailRock;
        src: url(Gail-Rock-Regular.otf);
      }

/* Font for the "eg" logo */
      h1 {
        margin: 10px;
        font-family: "Handjet", sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 45px;
      }

/* Background image of recipe book + gingham */
      body {
        background-image: url("homepage.png");
        width: 1200px;
        margin: 5px;
      }
      
/* eg logo */
      h2 {
        font-family: "GailRock";
        font-weight: 400;
        font-style: normal;
      }

/* Sweet, Savoury, Frozen text */
      h3 {
        font-family: "Oooh Baby", cursive;
        font-weight: 900;
        font-style: normal;
        font-size: 23px;
      }

/* Elenas digital recipe archive text */
      h4 {
        font-family: "Oooh Baby", cursive;
        font-weight: 500;
        font-style: normal;
        font-size: 40px;
        text-align: center;
      }

/* nav bar at the top */
      nav {
        background-color: white;
        margin: 0px;
        padding-left: 30px;
        width: 1200px;
        height: 70px;
        margin-top: -5px;
        margin-left: -5px;
      }

      nav h1 {
        display: inline;
        float: left;
        margin-left: 40px;
        margin-top: 6.5px;
      }

      nav h2 {
        display: inline;
        float: right;
        position: relative;
        right: 150px;
      }

      ul {
        font-weight: 700;
        list-style-type: none;
        text-align: left;
      }

/* Once multi page is active!!!!! */
/*       nav li {
        display: inline-block;
        margin-right: 20px;
      }

      nav a {
        text-decoration: none;
        color: #357e42;
      }

      nav a:hover {
        color: #ffa3bc;
      } */

      
      .container {
        display: grid;
        grid-template-columns: 33% 33% 33%;
        width: 800px;
        text-align: center;
        margin: 0 auto;
      }

      .recipe-icons {
        min-height: 10px;
        min-width: 10px;
        gap: 5px;
      }
      
      .recipe-icons h3{
       margin-top: 7px;
      }

      .title-section {
        display: grid;
        grid-template-columns: 100%;
        margin-top: 100px;
      }
      
      .title-section h4 {
       width: 600px;
       margin: 0 auto;
       padding-top: 100px;
       padding-bottom: 20px;
       position: relative;
       left: 10px;
      }
      
    </style>
  </head>

  <body>
    <nav>
      <ul>
        <h1>eg</h1>
        <h2>RECIPES</h2>
      </ul>
    </nav>
    <div class="title-section">
      <h4>Elena's Digital Recipe Archive</h4>
    </div>
    <div class="container">
    <div class="recipe-icons">
          <img src="pntbtrcookie.png" alt="a crispy peanut butter cookie covered in sugar, with chunks of peanuts strewed throughout">
          <h3>Sweet</h3>
      </div>
    <div class="recipe-icons">
          <img src="gnocchipic.png" alt="a sheet pan of gnocchi, broccoli, and pieces of sausage- covered in olive oil, lemon juice and chili flakes">
          <h3>Savoury</h3>
      </div>
    <div class="recipe-icons">
          <img src="icecream.png" alt="A metal container of partially scooped vanilla icecream">
          <h3>Frozen</h3>
        </div>
    </div>
  </body>
</html>
