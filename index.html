<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="UTF-8">
    <title>Egvozdek Final Project</title>
    <!-- Created by Elena Gvozdek, Nov 14th, 2026 -->
    <!--FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Oooh+Baby&display=swap" rel="stylesheet">

    <style>

      .hero {
            width: 1200px;
            height: 50px;
            background-color: white;
            margin-bottom: 40px;
            display: flex;
      }
      
      .text-sections {
        display: grid;
        grid-template-columns: 15% 35% 35% 35%;
        padding: 10px;
      }
      
      body {
        background-image: url("homepagebckgrnd.png");
        width: 1200px;
        height: 751px;
        margin: 5px;
      }

      h1, h2 {
        font-family: "Oooh Baby", cursive;
        font-weight: 900;
        font-style: normal;
        text-align: center;
        margin: 1px;
      }
      
      .container {
        display: grid;
        grid-template-columns: 17% 17% 17%;
        gap: 42px;
        max-width: 1200px;
        margin: 25% auto;
        justify-content: center;
      }

      .recipe-icons {
        min-height: 150px;
        min-width: 150px;
      }
      

    </style>
  </head>
  <body>
    <div class="hero">
      <div class="text-sections">
      <h2>EG</h2>
      <h2>SWEET</h2>
      <h2>SAVOURY</h2>
      <h2>FROZEN</h2>
    </div>
    </div> 
    <div class="title">
<!--           <h1>Elena's Digital Recipe Archive</h1> -->
    </div>
    <div class="container">
      <div class="recipe-icons">
        <img src="pntbtrcookie.png" alt="a crispy peanut butter cookie covered in sugar, with chunks of peanuts strewed throughout">
        <h2>Sweet</h2>
      </div>
      <div class="recipe-icons">
        <img src="gnocchipic.png" alt="a sheet pan of gnocchi, broccoli, and pieces of sausage- covered in olive oil, lemon juice and chili flakes">
        <h2>Savoury</h2>
      </div>
        <div class="recipe-icons">
        <img src="icecream.png" alt="A metal container of partially scooped vanilla icecream">
          <h2>Frozen</h2>
      </div>

    </div>
  </body>
</html>
