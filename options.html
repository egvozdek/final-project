<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="UTF-8">
    <title>egvozdek Final Project</title>
    <!-- Created by Elena Gvozdek, Nov 14th, 2026 -->

    <!--FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Oooh+Baby&display=swap" rel="stylesheet">


    <style>
      /* Font for "Recipes" in the nav bar */
      @font-face {
        font-family: GailRock;
        src: url(Gail-Rock-Regular.otf);
      }

      /* Font for the "eg" logo */
      h1 {
        margin: 10px;
        font-family: "Handjet", sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 45px;
      }

      /* Background image of recipe book + gingham */
      body {
        background-image: url("optionspage.png");
        width: 1440px;
        height: 1300px;
        margin: 5px;
      }

      /* eg logo */
      h2 {
        font-family: "GailRock";
        font-weight: 400;
        font-style: normal;
      }

      /* Sweet, Savoury, Frozen text */
      h3 {
        font-family: "Oooh Baby", cursive;
        font-weight: 900;
        font-style: normal;
        font-size: 23px;
      }

      /* Elenas digital recipe archive text */
      h4 {
        font-family: "Oooh Baby", cursive;
        font-weight: 500;
        font-style: normal;
        font-size: 40px;
        text-align: center;
      }

      /* nav bar at the top */
      nav {
        background-color: white;
        margin: 0px;
        padding-left: 30px;
        width: 1440px;
        height: 70px;
        margin-top: -5px;
        margin-left: -5px;
        margin-bottom: 170px;
      }

      nav h1 {
        display: inline;
        float: left;
        margin-left: -30px;
        margin-top: 6.5px;
      }

      nav h2 {
        display: inline;
        float: right;
        margin-right: -50px;
        position: relative;
        right: 150px;
      }

      ul {
        font-weight: 700;
        list-style-type: none;
        text-align: left;
      }

      nav li {
        display: inline-block;
        margin-right: 20px;
      }

      nav a {
        text-decoration: none;
        color: black;
      }

      nav a:hover {
        color: #D35269;
      }

      .container {
        display: grid;
        grid-template-columns: 33% 33% 33%;
        width: 800px;
        text-align: center;
        justify-content: center;
        margin: 0 auto;
        column-gap: 50px;
        row-gap: 30px;
        margin-top: -70px;
      }

      .recipe-icons {
        min-height: 10px;
        min-width: 10px;
        text-align: center;
      }

/*       
  Code snippet from w3 schools tutorial on shaking images     */
      .recipe-icons:hover {
        animation: shake 3s;
        animation-iteration-count: infinite;
      }

  @keyframes shake {
  0% { transform: translate(1px, 1px) rotate(0deg); }
  10% { transform: translate(-1px, -2px) rotate(-1deg); }
  20% { transform: translate(-3px, 0px) rotate(1deg); }
  30% { transform: translate(3px, 2px) rotate(0deg); }
  40% { transform: translate(1px, -1px) rotate(1deg); }
  50% { transform: translate(-1px, 2px) rotate(-1deg); }
  60% { transform: translate(-3px, 1px) rotate(0deg); }
  70% { transform: translate(3px, 1px) rotate(-1deg); }
  80% { transform: translate(-1px, -1px) rotate(1deg); }
  90% { transform: translate(1px, 2px) rotate(0deg); }
  100% { transform: translate(1px, -2px) rotate(-1deg); }
}
    </style>
  </head>

  <body>
    <nav>
      <ul>
        <h1><a href="index.html">eg</a></h1>
        <h2><a href="options.html">RECIPES</a></h2>
      </ul>
    </nav>
    <div class="container">
      <div class="recipe-icons">
        <a href="recipepage.html"><img src="grmnchoccookies.png" alt="a close up of a double chocolate cookies with chocolate chips and walnuts"></a>
      </div>

      <div class="recipe-icons">
        <img src="orangecake.png" alt="an up close shot of an orange olive oil cake with 2 slices cut into it">
      </div>

      <div class="recipe-icons">
        <img src="strawbcake.png" alt="a birds-eye shot of a circular vanilla cake with strawberries on top and a spoon laying in the pan">
      </div>

      <div class="recipe-icons">
        <img src="beercake.png" alt="a chocolatey guiness cake on a white plate with thick cream cheese frosting on top">
      </div>

      <div class="recipe-icons">
        <img src="bananablondies.png" alt="square banana bread blondies lying on top of crumpled parchment paper">
      </div>

      <div class="recipe-icons">
        <img src="applemuffins.png" alt="apple crumble muffins with white glaze on top of marbled countertop">
      </div>


      <div class="recipe-icons">
        <img src="chocchipcookies.png" alt="chocolate chip cookies with sea salt on a piece of crumpled parchment paper">
      </div>

      <div class="recipe-icons">
        <img src="peanutcookie.png" alt="a close up shot a crackly peanut butter cookie with coarse sugar on top and peanuts sticking out">
      </div>

      <div class="recipe-icons">
        <img src="mexicancookie.png" alt="a close up of a chocolate cookie with melted marshmallow filling its crackly top">
      </div>

    </div>
  </body>
</html>
